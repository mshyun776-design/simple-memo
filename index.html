<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단 메모장</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:white;color:#222;font:16px system-ui,sans-serif}main{max-width:560px;margin:auto}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}h1{font-size:24px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:5px}input,textarea{display:block;width:100%;margin-top:6px}textarea{min-height:120px;resize:vertical}button{background:#f5f5f5;cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.5;cursor:wait}p{overflow-wrap:anywhere}article p{white-space:pre-wrap}#status{min-height:24px}[hidden]{display:none!important}</style>
<main><h1>간단 메모장</h1><p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<section id="app" hidden><p id="account"></p><button id="logout">로그아웃</button><form id="memoForm"><label>메모 내용<textarea id="content" required></textarea></label><button type="submit">저장</button></form><div id="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
let db,user=null,busy=false;
function status(text){$('status').textContent=text}
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function run(message,fn){if(busy)return;lock(true);status(message);try{await fn()}catch(e){status('오류: '+(e.message||'다시 시도해 주세요.'))}finally{lock(false)}}
async function load(){const {data,error}=await db.from('memos').select('id,content,created_at').order('created_at',{ascending:false});if(error)throw error;$('list').replaceChildren();for(const memo of data){const card=document.createElement('article'),text=document.createElement('p'),button=document.createElement('button');text.textContent=memo.content;button.textContent='삭제';button.onclick=()=>run('삭제 중…',async()=>{const {error}=await db.from('memos').delete().eq('id',memo.id);if(error)throw error;await load();status('삭제했습니다.')});card.append(text,button);$('list').append(card)}if(!data.length){const p=document.createElement('p');p.textContent='저장된 메모가 없습니다.';$('list').append(p)}}
async function show(session){user=session?.user||null;$('auth').hidden=!!user;$('app').hidden=!user;$('account').textContent=user?.email||'';$('list').replaceChildren();if(user)await load();status(user?'메모를 입력해 주세요.':'로그인하거나 회원가입해 주세요.')}
async function authenticate(signup){if(!$('loginForm').reportValidity())return;await run(signup?'가입 중…':'로그인 중…',async()=>{const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session)throw new Error('이메일 확인 설정을 확인해 주세요.');$('password').value='';await show(data.session)})}
$('loginForm').onsubmit=e=>{e.preventDefault();authenticate(false)};$('signup').onclick=()=>authenticate(true);
$('memoForm').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){status('메모 내용을 입력해 주세요.');return}run('저장 중…',async()=>{const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await load();status('저장했습니다.')})};
$('logout').onclick=()=>run('로그아웃 중…',async()=>{const {error}=await db.auth.signOut();if(error)throw error;await show(null)});
(async()=>{try{if(!window.supabase)throw new Error('인증 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.');db=window.supabase.createClient('https://lrpauddkwnkzkjqbsxqa.supabase.co','sb_publishable_fLWtvyF10OqV3IBcns9lbg_UxXQPOVj',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'simple-memo-auth'}});const {data,error}=await db.auth.getSession();if(error)throw error;await show(data.session);db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('auth').hidden=false;$('app').hidden=true;$('list').replaceChildren();status('로그아웃했습니다.')}})}catch(e){status('오류: '+e.message)}})();
</script></html>
